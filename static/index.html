<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Herbal Guide</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#e6eee3;--surface:#f6faf3;--ink:#13281d;--muted:#4f6657;--accent:#1f5c3d;--onaccent:#f6faf3;--gold:#c98a0b;--warn:#7a2e1d;--warnbg:#f7e3d9;--line:#c3d3c4}
@media (prefers-color-scheme:dark){:root{--bg:#0e1a14;--surface:#16271e;--ink:#e3eedf;--muted:#9bb2a2;--accent:#6fcf9a;--onaccent:#0e1a14;--gold:#e8b24a;--warn:#f0b9a5;--warnbg:#3a1f17;--line:#2b4034}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5;display:flex;justify-content:center}
.app{width:100%;max-width:780px;height:100%;display:flex;flex-direction:column}
header{padding:18px 20px 8px;display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:14px;background:var(--accent);color:var(--onaccent);display:grid;place-items:center;font-size:1.6rem}
h1{font-size:1.6rem;font-weight:800;margin:0;letter-spacing:-.02em;line-height:1.1}
header p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.note{margin:4px 20px 6px;padding:7px 12px;background:var(--warnbg);color:var(--warn);border-radius:10px;font-size:.8rem}
#log{flex:1;overflow-y:auto;padding:8px 20px 12px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:11px 14px;border-radius:16px;font-size:.96rem;white-space:pre-wrap}
.bot{background:var(--surface);border:1px solid var(--line);border-top-left-radius:4px;align-self:flex-start}
.me{background:var(--accent);color:var(--onaccent);border-top-right-radius:4px;align-self:flex-end}
.urgent{background:var(--warnbg);color:var(--warn);border-color:var(--warn);font-weight:600}
.herb{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:6px 16px 16px 6px;padding:12px 14px;align-self:flex-start;max-width:94%}
.herb h2{margin:0;font-size:1.15rem}
.aka{color:var(--muted);font-size:.8rem;margin-bottom:4px;font-style:italic}
.herb dt{font-weight:600;margin-top:8px;color:var(--accent);font-size:.9rem}
.herb dd{margin:2px 0 0;font-size:.93rem}
.caut{margin-top:10px;padding:8px 10px;border-radius:8px;background:var(--warnbg);color:var(--warn);font-size:.86rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:4px 20px 6px}
.chips button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 13px;font:inherit;font-size:.84rem;cursor:pointer}
.chips button:hover{border-color:var(--accent)}
form{display:flex;gap:8px;padding:8px 20px 16px}
input{flex:1;min-width:0;padding:13px 15px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.send{border:0;background:var(--accent);color:var(--onaccent);font:inherit;font-weight:600;border-radius:14px;padding:0 20px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.dots span{display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){.dots span{animation:none}}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">🌿</div><div><h1>Herbal Guide</h1><p>Your friendly plant-remedy helper</p></div></header>
<div class="note">Educational only. Not medical advice or a diagnosis. Please check with a doctor before using any herb, especially if you are pregnant or take medicines.</div>
<div id="log" aria-live="polite"></div>
<div class="chips" id="chips"></div>
<form id="f"><input id="q" type="text" placeholder="Type here, e.g. I have a cough, which plant should I take?" autocomplete="off" aria-label="Your question"><button class="send" type="submit">Send</button></form>
</div>
<script>
var log=document.getElementById("log"),q=document.getElementById("q");
function add(t,c){var d=document.createElement("div");d.className="msg "+c;d.textContent=t;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
function row(dl,label,text){var t=document.createElement("dt");t.textContent=label;var d=document.createElement("dd");d.textContent=text;dl.appendChild(t);dl.appendChild(d)}
function card(h){var d=document.createElement("div");d.className="herb";
var t=document.createElement("h2");t.textContent=h.name;var a=document.createElement("div");a.className="aka";a.textContent=h.scientific;
var dl=document.createElement("dl");row(dl,"Traditional uses",h.uses);row(dl,"How it’s commonly taken",h.how_to_take);
var c=document.createElement("div");c.className="caut";c.textContent="Caution: "+h.caution;
d.appendChild(t);d.appendChild(a);d.appendChild(dl);d.appendChild(c);log.appendChild(d)}
function ask(text){text=text.trim();if(!text)return;add(text,"me");
var d=add("","bot");d.innerHTML="<span class='dots'><span></span><span></span><span></span></span>";
fetch("/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:text})})
.then(function(r){return r.json()}).then(function(o){
setTimeout(function(){d.remove();add(o.reply,"bot"+(o.urgent?" urgent":""));
(o.herbs||[]).forEach(card);if(o.closing)add(o.closing,"bot");log.scrollTop=log.scrollHeight},500)})
.catch(function(){d.remove();add("Oops, I couldn’t reach the server. Please check that it is running and try again. 🙏","bot")})}
document.getElementById("f").addEventListener("submit",function(e){e.preventDefault();var v=q.value;q.value="";ask(v)});
["I have a cough, which plant should I take?","Which plant reduces my headache?","I can’t sleep at night","Plant for acidity and gas","How can I control blood sugar?","Tell me about tulsi"].forEach(function(s){var b=document.createElement("button");b.type="button";b.textContent=s;b.onclick=function(){ask(s)};document.getElementById("chips").appendChild(b)});
add("Hello! 👋🌿 I’m your Herbal Guide. Tell me what you’re feeling, and I’ll suggest plants that are traditionally used. You can type your own question or tap one of the examples below. How can I help you today?","bot");
</script>
</body>
</html>
